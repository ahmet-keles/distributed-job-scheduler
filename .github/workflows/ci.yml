name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  infrastructure:
    name: infrastructure validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deploy/aws

      - name: Initialize providers without a backend
        working-directory: deploy/aws
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: deploy/aws
        run: terraform validate

  arm64-image:
    name: ARM64 container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build scheduler image for ARM64
        run: docker buildx build --platform linux/arm64 --tag scheduler:arm64-check .

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # ubuntu-latest runners ship a running Docker daemon, which is all
      # Testcontainers needs. The script fails fast with a readable error if
      # Docker is unusable and pre-pulls the test image with retries, so a
      # registry hiccup surfaces here instead of inside a test log.
      - name: Verify Docker and pre-pull test images
        run: .github/scripts/prepare-docker.sh postgres:17-alpine

      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
