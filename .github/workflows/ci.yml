name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      # ubuntu-latest runners ship a running Docker daemon, which is all
      # Testcontainers needs. The script fails fast with a readable error if
      # Docker is unusable and pre-pulls the test image with retries, so a
      # registry hiccup surfaces here instead of inside a test log.
      - name: Verify Docker and pre-pull test images
        run: .github/scripts/prepare-docker.sh postgres:17-alpine

      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
