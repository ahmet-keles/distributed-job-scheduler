spring.application.name=job-scheduler

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5440}/${POSTGRES_DB:jobs}
spring.datasource.username=${POSTGRES_USER:jobs_user}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,info

# Poller, heartbeat, and reaper are independent scheduled triggers; they must
# not serialize behind one another on a single scheduler thread.
spring.task.scheduling.pool.size=4

# Worker: claiming, execution, leases. See WorkerProperties for the meaning
# and the validation of every bound. heartbeat-interval must stay well below
# lease-duration: the margin is how many missed heartbeats a live worker
# survives before its job is reclaimed and re-executed.
app.worker.enabled=true
app.worker.poll-interval-ms=1000
app.worker.batch-size=5
app.worker.concurrency=4
app.worker.lease-duration=30s
app.worker.heartbeat-interval-ms=10000
app.worker.reaper-interval-ms=15000
app.worker.reaper-batch-size=50

# Retry backoff for failed attempts: initial * multiplier^(n-1), capped.
app.worker.retry-initial-backoff=5s
app.worker.retry-multiplier=2.0
app.worker.retry-max-backoff=5m
